[package]
name = "ultron"
version = "1.1.36"
description = "SYLVER notch assistant"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
whisper-rs = "0.16.0"
cpal = "0.18.2"
ureq = { version = "2", features = ["json"] }
# the phone link (link.rs): finding the phone on the network, and its WebSocket
mdns-sd = "0.11"
tungstenite = "0.24"
getrandom = "0.3"
png = "0.17"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
nnnoiseless = { version = "0.5", default-features = false }
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }
realfft = "3"
# email inside SYLVER: talking to the mail server, and reading messages
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"

windows-future = "0.2"
# WebView2's own interfaces, for its memory level (the same versions Tauri uses)
webview2-com = "0.39.1"
wcore62 = { package = "windows-core", version = "0.62" }

[dependencies.windows]
version = "0.61"
features = [
  "Data_Xml_Dom",
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Media_MediaProperties",
  "Media_Transcoding",
  "Storage",
  "Media_Control",
  "Storage_Streams",
  "UI_Notifications",
  "UI_Notifications_Management",
  "ApplicationModel",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_RemoteDesktop",
  "Win32_System_JobObjects",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Notifications",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true

# whisper.cpp is unusably slow unoptimized, even in dev builds
[profile.dev.package.whisper-rs-sys]
opt-level = 3
