<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ULTRON cursor</title>
<style>
html, body{margin:0; width:100%; height:100%; overflow:hidden; background:transparent}
#g{position:absolute; left:0; top:0; width:100%; height:100%; transform-origin:8px 6px; opacity:0; transform:scale(.2) rotate(-25deg);
  transition:opacity .25s, transform .55s cubic-bezier(.2,1.45,.4,1)}
#g.on{opacity:1; transform:none}
.cur{position:absolute; left:8px; top:6px; width:25px; height:38px; overflow:visible; filter:drop-shadow(0 2px 2.5px rgba(0,0,0,.4));
  transform-origin:0 0; transition:transform .18s cubic-bezier(.2,1.6,.4,1)}
.cur .body{fill:#fff; stroke:#000; stroke-width:.95; stroke-linejoin:round}
.eyes{transition:transform .25s cubic-bezier(.2,1.2,.4,1)}
.eye{fill:#000; transform-box:fill-box; transform-origin:50% 50%; transition:transform .2s}
.blink .eye{animation:blink .17s ease-in-out}
@keyframes blink{50%{transform:scaleY(.1)}}
.happy .eye{transform:translateY(-.2px) scaleY(.32)}
.oops .eye{transform:scale(.8)}
.think .eyes{animation:think 1.4s ease-in-out infinite}
@keyframes think{0%,100%{transform:translate(.5px,-.6px)} 50%{transform:translate(-.3px,-.6px)}}
.tap .cur{transform:translateY(1.2px) scale(.96)}
.press .cur{transform:scale(.82)}
.rip{position:absolute; left:8px; top:6px; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; border:2px solid rgba(255,255,255,.9);
  box-shadow:0 0 0 1px rgba(0,0,0,.25); animation:rip .5s ease-out forwards; pointer-events:none}
@keyframes rip{from{transform:scale(.2); opacity:1} to{transform:scale(1.3); opacity:0}}
.tag{position:absolute; left:30px; top:35px; max-width:228px; padding:5px 9px 7px; border-radius:6px; overflow:hidden;
  background:rgba(16,16,18,.9); box-shadow:0 0 0 .5px rgba(255,255,255,.2), 0 6px 16px rgba(0,0,0,.3); color:rgba(255,255,255,.95);
  font:500 11.5px/1.25 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; letter-spacing:.005em; white-space:nowrap; text-overflow:ellipsis;
  transform-origin:0 0; transition:max-width .35s cubic-bezier(.2,1,.3,1)}
.tag span{display:block; overflow:hidden; text-overflow:ellipsis}
.tag.swap span{animation:swap .32s cubic-bezier(.2,1,.3,1)}
@keyframes swap{from{opacity:0; transform:translateY(4px)}}
.track{position:absolute; left:0; right:0; bottom:0; height:1.5px; background:rgba(255,255,255,.1)}
.track b{position:absolute; left:0; top:0; bottom:0; width:0; background:rgba(255,255,255,.85); transition:width .5s cubic-bezier(.2,1,.3,1)}
.track::after{content:""; position:absolute; top:0; bottom:0; width:38%; left:-38%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
  animation:sweep 1.3s cubic-bezier(.4,0,.2,1) infinite}
@keyframes sweep{to{left:100%}}
.happy .track::after, .oops .track::after{display:none}
.happy .track b{width:100% !important}
.oops .track b{background:#ff9f0a}
</style>
</head>
<body>
<div id="g">
  <svg class="cur" viewBox="0 0 13 20">
    <path class="body" d="M1 1 V16.4 L4.7 12.9 L7.2 18.7 L9.6 17.7 L7.1 12.1 H12.2 Z"/>
    <g class="eyes" id="eyes"><ellipse class="eye" cx="3.25" cy="9.3" rx=".78" ry="1.15"/><ellipse class="eye" cx="5.75" cy="9.3" rx=".78" ry="1.15"/></g>
  </svg>
  <div class="tag" id="pill"><span id="say">ULTRON</span><div class="track"><b id="prog"></b></div></div>
</div>
<script>
const prog = document.getElementById('prog');
const g = document.getElementById('g'), eyes = document.getElementById('eyes'), say = document.getElementById('say'), pill = document.getElementById('pill');
let mood = 'idle', look = [0, 0];
function setEyes(){
  let [x, y] = look;
  if (mood === 'type') [x, y] = [-.35, .7];          // watching the words go in
  eyes.style.transform = `translate(${x * .55}px, ${y * .6}px)`;
}
// blink now and then, like the character in the notch
(function blink(){
  setTimeout(() => { if (mood !== 'done'){ g.classList.remove('blink'); void g.offsetWidth; g.classList.add('blink'); } blink(); }, 2200 + Math.random() * 2600);
})();
window.G = {
  appear(){ prog.style.width = '0%'; g.className = ''; void g.offsetWidth; g.classList.add('on'); mood = 'idle'; setEyes(); },
  vanish(){ g.classList.remove('on'); },
  progress(f){ prog.style.width = Math.round(f * 100) + '%'; },
  look(x, y){ look = [x, y]; setEyes(); },
  mood(m){ mood = m; g.classList.toggle('think', m === 'think'); setEyes(); },
  say(t){ if (say.textContent === t) return; say.textContent = t; pill.classList.remove('swap'); void pill.offsetWidth; pill.classList.add('swap'); },
  tap(){ g.classList.add('tap'); clearTimeout(this._t); this._t = setTimeout(() => g.classList.remove('tap'), 90); },
  click(){
    g.classList.add('press'); setTimeout(() => g.classList.remove('press'), 160);
    const r = document.createElement('div'); r.className = 'rip'; g.appendChild(r); setTimeout(() => r.remove(), 520);
  },
  done(){ mood = 'done'; g.classList.remove('think'); g.classList.add('happy'); look = [0, 0]; setEyes(); },
  oops(){ mood = 'done'; g.classList.remove('think'); g.classList.add('oops'); look = [0, 0]; setEyes(); },
};
</script>
</body>
</html>
